# 도급인의 안전보건조치 의무
# 본 현장은 도급인 지위이며 안전보건총괄책임자가 선임되어 있어 전부 적용된다.

- id: safety-council
  name: 안전보건협의체 운영
  category: 점검
  basis:
    law: 산업안전보건법 제64조제1항제1호
    rule: 산업안전보건법 시행규칙 제79조
  verified: false
  applies_when:
    role: 도급인
  frequency:
    every_months: 1
    text: "매월 1회 이상"
  output:
    form: 안전보건협의체 회의록
    format: pdf
  delegation: L2

- id: patrol-round
  name: 작업장 순회점검
  category: 점검
  basis:
    law: 산업안전보건법 제64조제1항제4호
    rule: 산업안전보건법 시행규칙 제80조
    note: 건설업은 2일에 1회 이상. 업종별로 주기가 다르므로 건설업 값만 사용한다.
  verified: false
  applies_when:
    role: 도급인
    industry: 건설업
  frequency:
    every_days: 2
    text: "2일에 1회 이상"
  output:
    form: 순회점검표
    format: pdf
  delegation: L2

- id: joint-inspection
  name: 합동 안전보건점검
  category: 점검
  basis:
    law: 산업안전보건법 제64조제1항제7호
    rule: 산업안전보건법 시행규칙 제82조
    note: 건설업은 2개월에 1회 이상. 도급인·수급인·근로자 대표의 참여 구성 요건이 있으므로 참석자 확인이 필수다.
  verified: false
  applies_when:
    role: 도급인
    industry: 건설업
  frequency:
    every_months: 2
    text: "2개월에 1회 이상"
  output:
    form: 합동 안전보건점검 결과서
    format: pdf
  delegation: L2

- id: ohs-committee
  name: 산업안전보건위원회 정기회의
  category: 점검
  basis:
    law: 산업안전보건법 제24조
    decree: 산업안전보건법 시행령 제34조 및 별표9, 제37조
    note: >-
      설치 대상은 건설업 공사금액 120억원 이상(건설산업기본법 시행령 별표1의
      토목공사업은 150억원 이상). 정기회의는 분기마다 개최한다.
  verified: false
  applies_when:
    contract_amount_krw_min: 12000000000
  frequency:
    every_months: 3
    text: "분기마다 1회"
  output:
    form: 산업안전보건위원회 회의록
    format: pdf
  delegation: L2

- id: corrective-action-ledger
  name: 지적사항 시정조치 관리
  category: 점검
  basis:
    law: 산업안전보건법 제17조
    decree: 산업안전보건법 시행령 제18조
    note: >-
      안전관리자의 직무로서 위험성평가·점검에서 나온 지적사항의 조치 여부를
      확인하는 것이 포함된다. 대장 자체의 서식을 정한 법령은 확인되지 않았다.
  verified: false
  applies_when: {}
  frequency:
    event_driven: true
    text: "지적사항 발생 시"
  output:
    form: 지적사항 대장
    format: pdf
  delegation: L3
