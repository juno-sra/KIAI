# 안전보건교육
# 주의: 교육시간 수치는 시행규칙 별표4 원문 대조 전이다. 전부 verified: false.

- id: education-regular-worker
  name: 근로자 정기교육
  category: 교육
  basis:
    law: 산업안전보건법 제29조제1항
    rule: 산업안전보건법 시행규칙 제26조 및 별표4
    note: >-
      교육시간은 별표4에서 근로자 구분(사무직/그 외, 일용/상용)에 따라 달라진다.
      구체 시간 수치는 원문 대조 후 기재한다. 현재 미확인.
  verified: false
  applies_when: {}
  frequency:
    every_months: 6
    text: "매 반기"
  output:
    form: 교육일지 및 서명부
    format: pdf
  delegation: L1

