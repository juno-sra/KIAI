- id: education-special
  name: 특별교육
  category: 교육
  basis:
    law: 산업안전보건법 제29조제3항
    rule: 산업안전보건법 시행규칙 제26조, 별표4 및 별표5
    note: >-
      유해·위험 작업에 근로자를 사용할 때 실시. 대상 작업 목록은 별표5에 있다.
      대상 작업과 교육시간 모두 원문 대조 필요.
  verified: false
  applies_when: {}
  frequency:
    event_driven: true
    text: "유해·위험작업 배치 시"
  output:
    form: 교육일지 및 서명부
    format: pdf
  delegation: L1

- id: education-basic-construction
  name: 건설업 기초안전보건교육 이수 확인
  category: 교육
  basis:
    law: 산업안전보건법 제31조
    note: >-
      건설 일용근로자를 채용할 때 기초안전보건교육을 이수하도록 해야 한다.
      교육시간 수치는 원문 대조 필요.
      개인정보 미취급 전제이므로 프로그램은 미이수 인원수만 집계하고
      개인 식별정보는 저장하지 않는다.
  verified: false
  applies_when:
    industry: 건설업
  frequency:
    event_driven: true
    text: "건설 일용근로자 채용 시"
  output:
    form: 기초안전보건교육 이수 현황(인원수)
    format: pdf
  delegation: L2
