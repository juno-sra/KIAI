# 법정서류 작성·제출 및 보고

- id: safety-cost-usage-report
  name: 산업안전보건관리비 사용내역서
  category: 서류
  basis:
    law: 산업안전보건법 제72조
    notice: 고용노동부고시 제2025-11호 「건설업 산업안전보건관리비 계상 및 사용기준」
    note: >-
      고시번호는 검색 결과 기반이며 원문 대조 전이다(시행 2025. 2. 12.로 확인됨).
      작성 주기와 보존기간은 고시 원문 대조 후 확정한다.
      출력은 기구축 apps/legal-cost 엔진을 재사용한다.
  verified: false
  applies_when:
    industry: 건설업
  frequency:
    every_months: 1
    text: "매월"
  output:
    form: 산업안전보건관리비 사용내역서
    format: pdf
    engine: legal-cost
  delegation: L2

- id: accident-investigation-report
  name: 산업재해조사표 제출
  category: 서류
  basis:
    law: 산업안전보건법 제57조제3항
    rule: 산업안전보건법 시행규칙 제73조
    note: 3일 이상 휴업이 필요한 부상·질병이 발생한 경우가 대상.
  verified: false
  applies_when: {}
  frequency:
    event_driven: true
    text: "재해 발생 시"
  deadline:
    from_event_months: 1
    text: "발생일부터 1개월 이내"
  output:
    form: 산업재해조사표
    format: pdf
  delegation: L1

- id: serious-accident-act-halfyear-check
  name: 중대재해처벌법 반기 점검
  category: 보고
  basis:
    law: 중대재해 처벌 등에 관한 법률 제4조
    decree: 중대재해 처벌 등에 관한 법률 시행령 제4조
    note: >-
      시행령 제4조의 여러 호에서 "반기 1회 이상 점검"을 요구한다
      (유해·위험요인 확인개선 절차 점검, 안전보건관리책임자 평가,
      비상대응 매뉴얼 점검 등). 해당 호 번호와 항목은 원문 대조 필요.
      점검 주체는 경영책임자이며 안전관리자는 자료를 준비하는 역할이다.
  verified: false
  applies_when: {}
  frequency:
    every_months: 6
    text: "반기 1회 이상"
  output:
    form: 중대재해처벌법 반기 점검 체크리스트
    format: pdf
  delegation: L2

- id: construction-safety-ledger-check
  name: 공사안전보건대장 이행 확인
  category: 서류
  basis:
    law: 산업안전보건법 제67조
    rule: 산업안전보건법 시행규칙 제86조
    note: >-
      대장 작성·확인 의무의 주체는 건설공사발주자다. 도급인(시공자)은 공사안전보건대장을
      작성하고 발주자의 확인을 받는 위치에 있다. 본 현장의 역할 구분과 확인 주기
      (3개월마다 1회 이상으로 알려져 있음)는 원문 대조 필요.
  verified: false
  applies_when:
    role: 도급인
  frequency:
    every_months: 3
    text: "3개월마다 1회 이상"
  output:
    form: 공사안전보건대장 이행 확인 결과
    format: pdf
  delegation: L2

- id: monthly-safety-report
  name: 월간 안전관리 보고
  category: 보고
  basis:
    law: 근거 확인 불가
    note: >-
      법령상 직접 근거가 확인되지 않는다. 통상 발주처 계약에 따른 의무다.
      본 현장은 발주처가 요구하는 서식이 없으므로 자체 서식을 설계한다.
      법정 의무가 아니므로 미제출이 법 위반은 아니다.
  verified: false
  applies_when: {}
  frequency:
    every_months: 1
    text: "매월"
  output:
    form: 월간 안전관리 보고서
    format: pdf
  delegation: L1

- id: legal-review-halfyear
  name: 법령 개정 대조 점검
  category: 보고
  basis:
    law: 근거 확인 불가
    note: >-
      법령상 의무가 아니라 본 프로그램의 자체 유지보수 규칙이다.
      rules/ 의 모든 항목을 국가법령정보센터 원문과 대조하고
      verified 플래그를 갱신한다. 이 점검을 빠뜨리면 규칙이 낡아
      프로그램 전체가 틀린 답을 내놓는다.
  verified: false
  applies_when: {}
  frequency:
    every_months: 6
    text: "반기 1회"
  output:
    form: 법령 대조 결과
    format: pdf
  delegation: L1
