[project]
name = "legalcost"
version = "0.1.0"
description = "법정경비 사용내역서 출력 엔진"
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0",
    "pypdfium2>=4.0",
    "pikepdf>=8.0",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
