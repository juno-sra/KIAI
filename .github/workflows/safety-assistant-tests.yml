name: safety-assistant tests

on:
  push:
    paths:
      - 'apps/safety-assistant/**'
      - '.github/workflows/safety-assistant-tests.yml'
  pull_request:
    paths:
      - 'apps/safety-assistant/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/safety-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: python -m pytest -v
